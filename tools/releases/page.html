<!DOCTYPE html>
<!-- Generated by tools/releases/build.py. -->
<html lang="$lang">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$title</title>
    <meta name="description" content="$description" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="canonical" href="$url" />
    $alternates
    <meta property="og:title" content="$title" />
    <meta property="og:description" content="$description" />
    <meta property="og:type" content="$og_type" />
    <meta property="og:url" content="$url" />
    <meta property="og:locale" content="$locale" />
    <meta property="og:site_name" content="ScriptPlayer+" />
    <link rel="icon" href="${up}assets/img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="${up}assets/img/icon-180.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css" />
    <link rel="stylesheet" href="$css" />
  </head>
  <body>
    <a class="skip-link" href="#main">$skip</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="$docs">
          <img src="${up}assets/img/icon.svg" width="26" height="26" alt="" />
          <span>ScriptPlayer+</span>
        </a>
        <nav class="site-nav" aria-label="$menu">
          <a href="$docs">$docs_label</a>
          <a href="./" $current>$releases_label</a>
        </nav>
        <nav class="lang-nav" aria-label="$languages">
          $lang_switch
        </nav>
        <a class="download-link" href="https://github.com/sioaeko/scriptplayer-plus/releases">$download <span aria-hidden="true">↗</span></a>
      </div>
    </header>
    <main id="main" tabindex="-1">
$content
    </main>
    <footer class="site-footer">
      <span>ScriptPlayer+</span>
      <a href="https://github.com/sioaeko/scriptplayer-plus/issues">$report <span aria-hidden="true">↗</span></a>
    </footer>
  </body>
</html>
